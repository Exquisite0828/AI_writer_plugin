id: custom_profile_smoke
schema_version: eval_case.v1
description: External custom profile demo must remain a profile-driven smoke case, not an official L3 type.
document_type: custom_technical_note
case_type: positive_smoke
mode: run_task
task_path: examples/custom_technical_note_profile_demo_fixture/task.yaml
expected_result: pass
metrics:
  - material_classification
  - source_tier_policy
  - template_extraction
  - evidence_mapping
  - sample_misuse
  - reference_misuse
  - critical_claim_policy
  - forbidden_final_claim
  - final_status_policy
  - candidate_update_inactive
