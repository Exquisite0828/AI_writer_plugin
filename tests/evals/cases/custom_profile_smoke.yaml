expectations:
  forbidden_terms:
    - ASIL
    - S/E/C
    - severity rating
    - exposure rating
    - controllability rating
    - safety goal
    - hazardous event
    - release test verdict
  allowed_final_statuses:
    - ready_for_human_review
    - finalized_with_open_items
    - blocked_pending_confirmation
