id: generic_document_smoke
schema_version: eval_case.v1
description: Generic document mode must run through the same eval harness without built-in domain leakage.
document_type: generic_document
case_type: positive_smoke
mode: run_task
task_path: examples/generic_document_demo_fixture/task.yaml
expected_result: pass
metrics:
  - material_classification
  - source_tier_policy
  - template_extraction
  - evidence_mapping
  - sample_misuse
  - reference_misuse
  - critical_claim_policy
  - forbidden_final_claim
  - final_status_policy
  - candidate_update_inactive
  - cross_document_leakage
expectations:
  forbidden_terms:
    - ASIL
    - S/E/C
    - severity rating
    - exposure rating
    - controllability rating
    - safety goal
    - hazardous event
    - final architecture decision
    - release test verdict
  allowed_final_statuses:
    - ready_for_human_review
    - finalized_with_open_items
    - blocked_pending_confirmation
