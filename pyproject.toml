[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-writing-plugin"
version = "0.1.0"
description = "Deterministic engine for an AI professional document writing plugin."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.urls]
Repository = "https://github.com/AncoderAI/Ancoder_Writer_Agent"
Issues = "https://github.com/AncoderAI/Ancoder_Writer_Agent/issues"

[tool.setuptools.packages.find]
include = ["ai_writing_plugin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
