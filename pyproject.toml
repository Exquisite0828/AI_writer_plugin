[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-writing-plugin"
version = "0.1.0"
description = "Deterministic run scaffold for the AI professional document writing Claude Code plugin."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ai_writing_plugin*"]
